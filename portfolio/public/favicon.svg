<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0c"/>
      <stop offset="100%" stop-color="#1a1a18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eacf7e"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="128" cy="128" r="128"/>
    </clipPath>
  </defs>

  <!-- Circular background -->
  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>

  <!-- Subtle grid texture clipped to circle -->
  <g clip-path="url(#circle-clip)" stroke="#fff" stroke-width="0.4" opacity="0.04">
    <line x1="0" y1="52"  x2="256" y2="52"/>
    <line x1="0" y1="104" x2="256" y2="104"/>
    <line x1="0" y1="156" x2="256" y2="156"/>
    <line x1="0" y1="208" x2="256" y2="208"/>
    <line x1="52"  y1="0" x2="52"  y2="256"/>
    <line x1="104" y1="0" x2="104" y2="256"/>
    <line x1="156" y1="0" x2="156" y2="256"/>
    <line x1="208" y1="0" x2="208" y2="256"/>
  </g>

  <!-- Circle border -->
  <circle cx="128" cy="128" r="126" fill="none" stroke="#2e2e2b" stroke-width="1.5"/>

  <!-- Corner brackets -->
  <path d="M68 76 L56 76 L56 88" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M188 180 L200 180 L200 168" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Status dot -->
  <circle cx="196" cy="62" r="4.5" fill="#eacf7e" opacity="0.85"/>
  <circle cx="196" cy="62" r="8" fill="none" stroke="#eacf7e" stroke-width="0.8" opacity="0.2"/>

  <!-- <g/> tag — monospace, centered -->
  <text
    font-family="'Courier New', Courier, monospace"
    font-size="44"
    font-weight="700"
    x="128"
    y="145"
    text-anchor="middle"
    dominant-baseline="central"
    fill="url(#gold)"
    opacity="0.97"
  >&lt;g/&gt;</text>

  <!-- Fine underline -->
  <line x1="80" y1="170" x2="176" y2="170" stroke="#eacf7e" stroke-width="0.8" stroke-linecap="round" opacity="0.28"/>
</svg>
